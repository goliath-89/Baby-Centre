  --diaper:#5CC4EE; --diaper-bg:#0F2E3D; --cry:#FF85AA; --cry-bg:#3F1B2A;
  --mile:#84D387; --mile-bg:#17331A; --tummy:#F28CCB; --tummy-bg:#3D1A31; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1124; --surface:#171D38; --surface-2:#232B4D; --ink:#EEF0FA; --ink-2:#A3ACCB; --line:#2C355E;
  --accent:#93A0FF; --on-accent:#0D1124;
  --feed:#F5A64D; --feed-bg:#3A2A14; --sleep:#A0A9FF; --sleep-bg:#252C60;
  --diaper:#5CC4EE; --diaper-bg:#0F2E3D; --cry:#FF85AA; --cry-bg:#3F1B2A;

.tummy .bar>i{background:var(--tummy)} .tummy .kv div{background:var(--bg)} .tummy.on .kv div{background:var(--surface)}
.dot.mile{background:var(--mile-bg);color:var(--mile)}
.row.mo{align-items:flex-start}.row .mn{display:block;margin-top:4px;color:var(--ink);font-size:13px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sugs{display:flex;flex-direction:column;gap:10px;max-height:240px;overflow:auto;padding:2px;border-radius:12px}
.sgh{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}.sgc{display:flex;flex-wrap:wrap;gap:6px}
.sug{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface-2);font-weight:700;font-size:13px}
.sug svg.i{width:16px;height:16px}.sug.done{background:var(--mile-bg);color:var(--mile)}.sug[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

#tl .seg button{padding:0 6px;font-size:14px}

.notes .tw{overflow-x:auto}.notes table{border-collapse:collapse;font-size:13px}.notes th,.notes td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.stat.burp .k{color:var(--mile)}.stat.burp{gap:6px}.stat.burp .s{flex:1}
.stat.burp .btn{gap:6px;min-height:44px;background:var(--mile-bg);color:var(--mile);margin-top:2px}
.stat.burp.due{background:var(--mile-bg);box-shadow:var(--shadow),inset 0 0 0 2px var(--mile)}.stat.burp.due .btn{background:var(--mile);color:var(--surface)}
.stat.burp.run{background:var(--mile-bg);box-shadow:var(--shadow),inset 0 0 0 2px var(--mile)}.stat.burp.run .k .pulse{margin-left:6px;color:var(--mile)}
.stat.burp .br{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stat.burp .br .tv{flex:1;min-width:120px;display:flex;flex-direction:column}

.dot.burp{background:var(--mile-bg);color:var(--mile)}.live.offer .dot.burp{background:var(--surface)}
/* Every running timer card gets an outline in its own colour, so active timers stand out at a glance. */
.live.feed{background:var(--feed-bg);color:var(--feed);box-shadow:inset 0 0 0 2px var(--feed)} .live.sleep{background:var(--sleep-bg);color:var(--sleep);box-shadow:inset 0 0 0 2px var(--sleep)}

.chart{width:100%;height:auto;display:block}
.chart text{font:600 10px var(--font);fill:var(--ink-2)}
.rib{cursor:pointer;display:flex;flex-direction:column;gap:8px}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:12px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tl{display:flex;flex-direction:column}

.dot.diaper{background:var(--diaper-bg);color:var(--diaper)} .dot.cry{background:var(--cry-bg);color:var(--cry)} .dot.mile{background:var(--mile-bg);color:var(--mile)}

.row .ti{font-weight:700}
.row .su{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}

.empty{color:var(--ink-2);text-align:center;padding:22px 10px}
/* dock + nav */

#dock{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:20;padding:18px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
#dock .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px;border-radius:24px;background:var(--surface-2);border:1px solid var(--line);box-shadow:0 10px 28px rgba(13,17,36,.22)}

.qa:active{transform:translateY(2px);border-bottom-width:2px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(13,17,36,.10);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:66px}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:var(--ink-2)}
#nav .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
#nav button[aria-current="page"]{color:var(--accent)}

.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}

.cause .bar{grid-column:1/-1}
.cause b{font-size:15px}.cause.top b{font-size:19px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{color:var(--ink-2);font-size:13px}
.flag{background:var(--cry-bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px}
.flag b{color:var(--cry)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface-2);font-weight:700}
#sheet-root .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#sheet-root .chip{padding:0;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--bg);border-radius:12px;padding:8px 4px}
.kv b{display:block;font-size:17px}.kv span{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* milestones */
.ms{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 2px;min-height:52px;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.ms.done .box{background:var(--mile);border-color:var(--mile);color:var(--surface)}
.ms .d{display:block;color:var(--mile);font-size:12px;font-weight:700}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1}.prog .bar>i{background:var(--mile)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--mile)}
.sdot.s-offline,.sdot.s-connecting,.sdot.s-syncing{background:var(--feed)}.sdot.s-denied{background:var(--cry)}
.errlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.codebox{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set{display:flex;flex-direction:column;gap:12px}
.set .line{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.set .line>span:first-child:not(.av),.set .line>.av+span{flex:1 1 150px;min-width:0}
</style>

<template id="relnotes" data-built="2026-11-24T20:52:53.406Z"><h3>1.9.0 · 24 November 2026</h3><p>Stage 1 of the new More section.</p><ul><li><b>More is now a menu.</b> It lists <b>Development tracker</b> and <b>Vaccinations</b> (both coming next) and <b>Settings</b>. Settings holds everything that was under More before: sharing, the baby's details, units, appearance, Excel, backup, About and Erase. A back arrow returns to the menu.</li><li><b>Changes are confirmed before they are saved.</b></li><li>Editing an entry, a journal milestone or the baby's details lists exactly what will change (for example "Amount: 150 ml → 170 ml") with <b>Save changes</b> or <b>Back</b>. Back keeps what you typed. If nothing changed, the sheet just closes.</li><li>Deleting an entry or a milestone, restoring a backup and stopping sharing each ask first.</li><li>Bottle units and appearance switch straight away with an <b>Undo</b>.</li><li>Fixed: re-saving a finished breast feed without changes could slightly alter its end time.</li></ul><h3>1.8.5 · 23 November 2026</h3><ul><li><b>Outlines on every running timer.</b> Like the burp card, each active timer card now has an outline in its own colour: amber for a feed (running or paused), indigo for sleep, magenta for tummy time and green for burping.</li></ul><h3>1.8.4 · 23 November 2026</h3><ul><li><b>Editing the start of a running feed moves its clock.</b> If a breast feed is still running (or paused) and you set its start 10 minutes earlier, the feed clock now shows the extra 10 minutes straight away, added to the side being fed. A later start shortens it. Sleep, burp and tummy time timers already followed their start time.</li></ul><h3>1.8.3 · 23 November 2026</h3><ul><li><b>Next breast side on the Last feed tile.</b> The tile now always shows <b>Next breast side LEFT</b> or <b>RIGHT</b>, the opposite of the side the last breast feed ended on, even when the most recent feed was a bottle.</li><li><b>Fixed: baby's age a day out in some time zones.</b> In time zones behind UTC (the Americas, for example) a date of birth was read as the evening before, so the age and milestone ages could be one day out. Plain dates are now always read as that local day. This did not affect UTC+8.</li></ul><h3>1.8.2 · 23 November 2026</h3><ul><li><b>Last feed badge shows Bottle.</b> When the last milk feed was a bottle, the Last feed tile now says <b>BOTTLE</b> instead of the side of the last breast feed. After a breast feed it still shows LEFT or RIGHT. The <b>next</b> tag on the L/R buttons still follows the last breast feed.</li></ul><h3>1.8.1 · 23 November 2026</h3><ul><li><b>Cry check on iPhone.</b> iPhones do not let a web page open the voice recorder; a request for audio opens the video camera instead. <b>Record a clip</b> on iPhone now opens the system menu, so you can choose <b>Take Video</b> (only the sound is used, so point the phone anywhere near your baby) or <b>Choose File</b> to pick a Voice Memo. The app takes the sound out of the video and analyses it.</li><li><b>Choose a saved clip</b> also accepts videos and Voice Memo files on every phone.</li><li>Android is unchanged: Record opens the sound recorder.</li></ul><h3>1.8.0 · 23 November 2026</h3><h4>New</h4><ul><li><b>Back and history on a cry result.</b> The result now starts with <b>‹ Record again</b> and <b>All checks</b> (jumps to your earlier checks).</li><li><b>More reasons, and your own.</b> "What was it really?" now offers Overtired, Too hot or cold, Wet or dirty nappy, Needs burping, Teething, Overstimulated, Bored and Unwell, alongside the six sound-based causes ("Tired" is now "Tired / sleepy"). <b>Other…</b> lets you type your own reason; it then appears as a button next time.</li><li><b>Results that learn your baby.</b> Each cry check now saves its sound measurements together with the situation from your log: time since the last feed against the usual gap, time awake against the awake window, time since the last nappy, minutes since a feed ended, and the time of day. When a new cry comes in, the app compares it with your past checks whose reason you confirmed and leans toward what similar cries turned out to be. One confirmation nudges the answer; several similar ones can decide it, including reasons you typed yourself. "What this is based on" says how many of your checks it compared with and what the closest ones were.</li></ul><h4>Good to know</h4><ul><li>Only checks made from this version on carry the saved measurements, so learning starts with your next confirmed checks.</li><li>This is a personal comparison on your own data, not a large trained model. It gets better the more often you confirm the reason, and it is still an estimate.</li></ul><h3>1.7.3 · 23 November 2026</h3><ul><li><b>Record opens your phone's recorder on the shared link.</b> Pages shown inside the Claude site are not allowed to use the microphone, whatever your browser's own permission says, which is why the permission prompt kept coming back. On the shared Claude link, <b>Record a clip</b> now opens your phone's recorder in one tap. Record 5–10 seconds, tap done or save, and the result appears straight away.</li><li>On the installed app the 5-second live recording still works. If the microphone is ever refused there, the app switches to your phone's recorder and remembers that choice.</li><li>"Upload a clip instead" is now <b>Choose a saved clip</b>.</li></ul><h3>1.7.2 · 21 November 2026</h3><ul><li><b>Running burp timer goes to the top.</b> While the burp timer runs, its widget moves to the top of Home, above the feed and sleep tiles, so it is the first thing you see. When stopped, it goes back to its half-size place beside Last feed.</li></ul><h3>1.7.1 · 21 November 2026</h3><p>Changes from your comments on the app.</p><ul><li><b>Burp widget beside Last feed.</b> The burp timer is now a half-size tile next to Last feed, the same size as Nappy, with a <b>Start</b> button. It turns green when a burp is due after a feed. While it runs, it widens to a full-width tile under Last feed with the timer, <b>Stop</b> and <b>Asleep</b>.</li><li><b>Timeline shows today.</b> The Timeline now lists today's entries only, headed with the day and date and a summary. <b>‹</b> steps back a day at a time and <b>›</b> forward; the Feeds, Sleep, Nappies and Tummy filters work within the day shown. A sleep that ran over midnight shows on both days.</li><li><b>Trends is now Insights</b>, in the tab bar and the page title.</li><li><b>Day timeline:</b> the Cry lane is gone and Tummy time has its own lane. Mixed nappies now read <b>Mixed</b> instead of "Both" (also in the timeline, the nappy buttons and Excel).</li><li><b>Clearer colours.</b> Nappies are now sky blue (easier to tell from the green burp) and tummy time is magenta (easier to tell from the indigo sleep). The Last 24 hours bar shows tummy time instead of cry checks.</li></ul><h3>1.7.0 · 20 November 2026</h3><h4>New</h4><ul><li><b>Build date and release notes.</b> More → About now shows the version with the date and time it was built, and a <b>Release notes</b> button that opens these notes inside the app.</li><li><b>Only the owner changes the shared log in bulk.</b> When a log is shared, only its owner sees Edit (baby's details), Excel Import, Restore and Erase all data. Your partner can still log feeds, sleep and everything else, and can still download an Excel file or a backup.</li><li>On the shared Claude link, the owner is the owner of the page.</li><li>On the installed app, the owner is the phone that started sharing.</li></ul><h4>Fixed</h4><ul><li><b>Partner kept having to tap Join, and Ounces did not stick.</b> On the shared Claude link, both were saved only in the phone's browser storage, which some browsers clear for pages shown inside another site. Each person's bottle units, appearance and "joined" choice are now also saved in their own private area of the shared page. If the browser forgets, the app puts them back and rejoins the shared log on its own.</li><li>A phone with no log of its own joins the shared log automatically when it opens the page.</li><li>A phone that has its own log is still asked first, so two logs are never combined without you choosing to.</li><li>After a deliberate <b>Stop sharing</b>, the app does not rejoin by itself.</li></ul><h4>Good to know</h4><ul><li>The owner-only rule is enforced by the app's screens, not by the database. Someone determined could still change data with other tools; this stops accidental or casual changes.</li><li>Fixed while testing: a phone that already had its own log could overwrite the shared baby's name and details when it joined. Joining now always keeps the shared profile.</li><li>I could not test your partner's actual phone. The fix is tested by clearing a phone's storage between visits, which reproduces what she described.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit</td><td>32 of 32 pass</td></tr><tr><td>End-to-end, one phone</td><td>34 of 34 pass</td></tr><tr><td>End-to-end, two phones</td><td>27 of 27 pass</td></tr></table></div><p>The two-phone suite now covers: partner controls hidden on both kinds of sharing, a phone whose storage is wiped between visits (rejoins, keeps Ounces and Dark), Stop sharing followed by a wipe (does not rejoin), and a phone with its own log being asked before joining.</p><h3>1.6.1 · 20 November 2026</h3><ul><li><b>Asleep while feeding or burping.</b> The sleep timer now runs alongside a feed or the burp timer; starting one never stops the other. <b>☾ Asleep</b> on the burp timer starts sleep and keeps the burp timer running.</li><li><b>Warnings instead of guesses.</b> If something looks off, for example a sleep timer left running for 7 hours or tummy time started while asleep, the confirmation message ends with "Check: …" and says what to look at. Nothing is changed for you.</li><li>Resuming or switching a breast feed still stops the burp timer, and now says so.</li></ul><p>Tests: 32 unit, 33 one-phone and 23 two-phone checks pass.</p><h3>1.6.0 · 20 November 2026</h3><h4>New</h4><ul><li><b>Tummy time</b> card on Home. Tap <b>▶ Start</b> when you lay your baby down and <b>■ Stop</b> when you finish. The card shows today's total, how many sessions today, the last session, and your baby's <b>record</b> (longest session). Beat it and the app tells you. "History ›" lists every session by day.</li><li><b>Milestone journal</b> on the Milestones tab. Tap <b>+ Add milestone</b>, pick a suggestion (30 of them, from first bath to first steps) or type your own, set the date and add notes. Your entries are listed newest first with your baby's age at the time.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit</td><td>32 of 32 pass</td></tr><tr><td>End-to-end, one phone</td><td>32 of 32 pass</td></tr><tr><td>End-to-end, two phones</td><td>23 of 23 pass</td></tr></table></div><p>The two-phone suite does not exercise these two features directly; both sync through the same path as every other entry.</p><h3>1.5.2 · 14 November 2026</h3><ul><li><b>Burp timer you can always reach.</b> A "Burp timer ▶ Start" row now sits at the top of Home whenever the green Burp time strip is not showing, so you can start it by hand at any time, including after a feed has been saved.</li><li>The green strip still appears on its own while a feed is paused and for 30 minutes after a feed ends. It does not appear while a sleep timer is running, which is the most likely reason it was missing for you; check whether an old sleep is still running at the top of Home.</li></ul><p>Tests: 30 unit, 30 one-phone and 23 two-phone checks pass.</p><h3>1.5.1 · 13 November 2026</h3><h4>Changed</h4><ul><li><b>■ Stop</b> on the burp timer now only saves the burp and tells you how long until the next nap. It no longer starts sleep.</li><li><b>☾ Asleep</b>, a new button beside Stop, is for when your baby has actually fallen asleep: it saves the burp and starts the sleep timer together.</li><li>The Sleep tile on Home counts down to the nap window while your baby is awake.</li></ul><p>How the countdown is worked out: the nap window is the typical awake time for your baby's age, counted from when they last woke. If no sleep has been logged yet, it is counted from the end of the last burp.</p><p>Tests: 30 unit, 30 one-phone and 23 two-phone checks pass.</p><h3>1.5.0 · 12 November 2026</h3><h4>New</h4><ul><li><b>Burp timer.</b> When you pause a feed, or for half an hour after a feed ends, a green <b>Burp time</b> strip appears at the top of Home. Tap <b>▶ Start</b> to time burping or upright time, and <b>■ Stop</b> when you are done.</li><li><b>Stop means bedtime.</b> Stopping the burp timer saves it and starts the sleep timer at the same moment. If the feed is only paused, sleep is not started, so you can resume feeding. Tap Undo, or "Woke up", if your baby is not going down.</li><li>Burp time shows in the timeline, in Today so far ("upright 12m"), on the Day timeline, and in the Excel export.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit</td><td>29 of 29 pass</td></tr><tr><td>End-to-end, one phone</td><td>30 of 30 pass</td></tr><tr><td>End-to-end, two phones</td><td>23 of 23 pass</td></tr></table></div><h4>Assumption to confirm</h4><p>"Once burping has stopped, assume the sleep schedule starts" was built as: stopping the burp timer starts the sleep timer. If you meant something else (for example, only starting the countdown to the next nap), say so and it is a small change.</p><h3>1.4.0 · 12 November 2026</h3><h4>New</h4><ul><li><b>Read the Last 24 hours bar.</b> On a phone, press and slide your finger along the bar (or press and hold); on a computer, hover. The line under the bar shows the time, whether your baby was asleep or awake, and any feed, nappy or cry check near that moment.</li><li><b>Day timeline on Trends.</b> Tap the bar (or "Full timeline") to open a larger view: time runs down the page, with sleep blocks, feeds, nappies and cry checks each in their own lane and labelled. Use the arrows to look at Today, Yesterday and earlier days. Tap anything to open and edit it.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit</td><td>29 of 29 pass</td></tr><tr><td>End-to-end, one phone</td><td>28 of 28 pass</td></tr><tr><td>End-to-end, two phones</td><td>23 of 23 pass</td></tr></table></div><p>The finger gestures were tested with simulated touch events in Chromium, not on a physical phone.</p><h3>1.3.0 · 12 November 2026</h3><h4>New</h4><ul><li><b>Pause a feed.</b> Tap <b>Pause</b> on the feed banner while you burp or change your baby, then <b>Resume</b> to carry on with the same side. The clock stops while paused, and the pause is left out of the feed's length. The lit L or R button in the tray also shows <b>Resume</b>.</li><li><b>New icon.</b> A blue outline bottle with "Baby Centre" inside. If the app is already on your home screen, remove it and add it again to pick up the new icon.</li><li><b>Last feed tile</b> now says LAST FEED with a solid <b>LEFT</b> or <b>RIGHT</b> badge.</li><li><b>Clearer bottom of the screen.</b> The five log buttons are in a raised tray with depth on each button; the navigation bar is a separate bar underneath with the current tab highlighted.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit</td><td>29 of 29 pass</td></tr><tr><td>End-to-end, one phone</td><td>27 of 27 pass</td></tr><tr><td>End-to-end, two phones</td><td>23 of 23 pass</td></tr></table></div><h4>Notes</h4><ul><li>The icon is an original drawing in the style of the reference you sent. The reference itself is a licensed Font Awesome Pro icon, so it was not copied.</li><li>The words inside the icon are readable on a large icon and on the splash screen; at the smallest home-screen sizes they become fine print.</li></ul><h3>1.2.0 · 12 November 2026</h3><h4>New</h4><ul><li><b>Filter the timeline.</b> Under Timeline on Home, tap Feeds, Sleep or Nappies to see only that activity, grouped by day with a total for each day.</li><li><b>Tap the tiles.</b> Last feed, Sleep and Nappy at the top of Home open their records.</li><li><b>Baby photo.</b> More → Baby → Edit → Add photo. It shows next to the name on Home and on your partner's phone.</li><li><b>Clearer sharing.</b> Share with partner is now the first thing under More.</li><li>Installed app: "Invite my partner" ends on an invite you can Send, Email or Copy. Your partner opens the link and taps Join.</li><li>Hosted page: "Share with my partner" turns sharing on and shows three steps, including a link to copy. Your partner sees a "Join" banner when they open the page.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit (<code>tests/core.test.js</code>, <code>tests/sync-xlsx.test.js</code>)</td><td>29 of 29 pass</td></tr><tr><td>End-to-end, one phone (<code>tests/e2e.js</code>)</td><td>26 of 26 pass</td></tr><tr><td>End-to-end, two phones (<code>tests/e2e-sync.js</code>)</td><td>23 of 23 pass</td></tr></table></div><h4>What was wrong with sharing in 1.1.0</h4><ol><li>The invite was only shown once, behind a small "Show invite" button, with Copy as the only option.</li><li>On the hosted page there was no invite step at all, only a sentence pointing at the page's Share menu, and the partner got no sign that a log was waiting.</li><li>If the hosted page could not reach its shared store, it offered the installed app's database setup, which cannot work there.</li></ol><h4>Still true</h4><ul><li>On the hosted page, giving your partner access happens in that page's own Share menu, outside the app. The app cannot do that step for you; it now tells you exactly what to do.</li><li>The installed app still needs the one-time free database (README).</li><li>Sync is tested against stand-ins for both services, not the live services.</li></ul><h3>1.1.0 · 12 November 2026</h3><h4>New</h4><ul><li><b>Share with partner.</b> One log on two phones, updated live. Start a feed on your phone and your partner sees the timer running and can stop it. Works offline and catches up later. Set up under More → Share with partner (steps in the README).</li><li><b>Excel.</b> More → Excel → Export saves the whole log as a workbook. Edit it and use Import to make the app match the file. Problems are listed by sheet and row before anything changes.</li></ul><h4>Your existing data</h4><p>Nothing to do. Data and backups from 1.0.0 are upgraded automatically the first time 1.1.0 opens.</p><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th>Result</th></tr><tr><td>Unit: predictions, stats, cry analysis, backup (<code>tests/core.test.js</code>)</td><td>16 of 16 pass</td></tr><tr><td>Unit: merge rules, migration, Excel writer and reader (<code>tests/sync-xlsx.test.js</code>)</td><td>12 of 12 pass</td></tr><tr><td>End-to-end, one phone, fake microphone (<code>tests/e2e.js</code>)</td><td>24 of 24 pass</td></tr><tr><td>End-to-end, two phones, sync and Excel (<code>tests/e2e-sync.js</code>)</td><td>21 of 21 pass</td></tr></table></div><p>The Excel tests open the exported file with openpyxl, edit and re-save it, and also pass it through LibreOffice and back. The sync tests run two separate browser sessions through joining, live timers, delete and undo, an offline period on both phones, a refused write, and stopping and rejoining.</p><h4>Bugs found and fixed before release</h4><div class="tw"><table><tr><th>#</th><th>Found by</th><th>Problem</th><th>Fix</th></tr><tr><td>1</td><td>Sync test</td><td>Sample milestones were sent to the shared log when starting your own log</td><td>Sample data leaves no change records behind</td></tr><tr><td>2</td><td>Sync test</td><td>A feed lasting a few seconds exported as 0 minutes and then blocked re-import</td><td>Untouched rows are accepted as they are</td></tr><tr><td>3</td><td>Review</td><td>Reading remote changes rescanned the whole log per record</td><td>Single pass</td></tr></table></div><h4>Known limits</h4><ul><li><b>Sync was tested against stand-ins, not the live services.</b> The Firebase connection was tested against a local server that follows Firebase's documented REST and streaming behaviour, and the hosted-page connection against a stand-in for that store. Neither has been run against the real service yet. The first real two-phone test is yours; if anything fails, the status line under More → Share with partner says what state it is in.</li><li><b>Installed-app sharing needs a free Firebase database</b> that you create once (about 5 minutes).</li><li><b>The invite is the key.</b> Anyone holding it can read and change the log. The data is not end-to-end encrypted.</li><li><b>Newest change wins per entry</b>, using each phone's clock. Keep both phones on automatic time.</li><li><b>Excel was checked with openpyxl and LibreOffice</b>, not Microsoft Excel itself. Import needs a browser from 2023 or later.</li><li>Limits from 1.0.0 still apply (below).</li></ul><h3>1.0.0 · 12 November 2026</h3><p>First release. Everything runs on your phone; nothing is uploaded.</p><h4>What you can do</h4><ul><li><b>Log in one or two taps</b> from the bottom of the home screen: breast (L/R, with switch), bottle, sleep, nappy.</li><li><b>See at a glance</b> how long since the last feed, how long awake or asleep, and the last nappy.</li><li><b>Plan ahead</b> with a predicted next feed time and nap window.</li><li><b>Check a cry</b>: record 5 seconds (or upload a clip) to get the likely cause, what to try, and when to seek help.</li><li><b>Review the week</b>: sleep pattern grid, sleep hours, breast minutes per side, bottle amounts, feeds per day.</li><li><b>Track milestones</b> from 0 to 12 months.</li><li><b>Back up and restore</b> your data by file or text.</li></ul><h4>Tested</h4><div class="tw"><table><tr><th>Suite</th><th lled app). On a plain <code>http://</code> address or inside a preview frame, use "Upload a clip".</li><li><b>Data lives in one browser on one phone.</b> Clearing site data deletes it. Use Backup.</li><li>No reminders, growth charts, multiple babies or sharing yet (see the roadmap in <code>docs/PRD.md</code>).</li></ul></template>

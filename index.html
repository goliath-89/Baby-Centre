<title>Baby Centre</title>

<style>
/* Layout: one thumb-reach column. Status up top, a 24-hour ribbon in the middle,
   every logging action in a dock pinned just above the tab bar. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#E2E7F3; --ink:#161B33; --ink-2:#56607F; --line:#D3DAEA;
  --accent:#3D4FD6; --on-accent:#FFFFFF;
  --feed:#B85C00; --feed-bg:#FCEAD3; --sleep:#4650C4; --sleep-bg:#E1E4FB;
  --diaper:#0B7A6F; --diaper-bg:#D5F0EC; --cry:#C22B5E; --cry-bg:#FBDFE8;
  --mile:#2F7D33; --mile-bg:#DDF1DD; --shadow:0 1px 2px rgba(22,27,51,.06),0 6px 20px rgba(22,27,51,.07);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1124; --surface:#171D38; --surface-2:#232B4D; --ink:#EEF0FA; --ink-2:#A3ACCB; --line:#2C355E;
  --accent:#93A0FF; --on-accent:#0D1124;
  --feed:#F5A64D; --feed-bg:#3A2A14; --sleep:#A0A9FF; --sleep-bg:#252C60;
  --diaper:#55D3C3; --diaper-bg:#12332F; --cry:#FF85AA; --cry-bg:#3F1B2A;
  --mile:#84D387; --mile-bg:#17331A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1124; --surface:#171D38; --surface-2:#232B4D; --ink:#EEF0FA; --ink-2:#A3ACCB; --line:#2C355E;
  --accent:#93A0FF; --on-accent:#0D1124;
  --feed:#F5A64D; --feed-bg:#3A2A14; --sleep:#A0A9FF; --sleep-bg:#252C60;
  --diaper:#55D3C3; --diaper-bg:#12332F; --cry:#FF85AA; --cry-bg:#3F1B2A;
  --mile:#84D387; --mile-bg:#17331A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-block:14px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#app.nodock{padding-bottom:110px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
header.top h1{font-size:26px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header.top h1{min-width:0;overflow-wrap:anywhere}
header.top .age{color:var(--ink-2);font-weight:600}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.link{color:var(--accent);font-weight:700;padding:8px 4px;min-height:44px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:600}
.banner .btn{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--cry-bg);color:var(--cry)}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.btn:active{transform:scale(.97)}
/* status */
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.stat .v{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.stat .s{color:var(--ink-2);font-size:13px;font-weight:600}
.stat.feed .k{color:var(--feed)} .stat.sleep .k{color:var(--sleep)} .stat.diaper .k{color:var(--diaper)} .stat.cry .k{color:var(--cry)}
.stat.wide{grid-column:1/-1}
.live{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;font-weight:700}
.live.feed{background:var(--feed-bg);color:var(--feed)} .live.sleep{background:var(--sleep-bg);color:var(--sleep)}
.live .t{font-size:26px;font-weight:800;line-height:1}
.live .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.live .btn{background:var(--surface);color:var(--ink)}
.pulse{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}
/* ribbon + charts */
.chart{width:100%;height:auto;display:block}
.chart text{font:600 10px var(--font);fill:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:12px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl .day{font-size:12px;font-weight:700;color:var(--ink-2);padding:10px 2px 4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 2px;min-height:52px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.dot.feed{background:var(--feed-bg);color:var(--feed)} .dot.sleep{background:var(--sleep-bg);color:var(--sleep)}
.dot.diaper{background:var(--diaper-bg);color:var(--diaper)} .dot.cry{background:var(--cry-bg);color:var(--cry)} .dot.mile{background:var(--mile-bg);color:var(--mile)}
.row .mid{flex:1;min-width:0}
.row .ti{font-weight:700}
.row .su{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.row .tm{color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
.empty{color:var(--ink-2);text-align:center;padding:22px 10px}
/* dock + nav */
#dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
#dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa{position:relative;min-height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;box-shadow:var(--shadow);background:var(--surface)}
.qa.feed{color:var(--feed)} .qa.sleep{color:var(--sleep)} .qa.diaper{color:var(--diaper)}
.qa.on.feed{background:var(--feed);color:var(--surface)} .qa.on.sleep{background:var(--sleep);color:var(--surface)}
.qa .big{font-size:20px;font-weight:800;line-height:1}
.qa .tag{position:absolute;top:-6px;right:-2px;background:var(--feed);color:var(--surface);font-size:10px;padding:1px 6px;border-radius:8px}
.qa:active{transform:scale(.95)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2)}
#nav button[aria-current="page"]{color:var(--accent)}
#nav .crybtn span.c{width:46px;height:46px;border-radius:50%;background:var(--cry);color:var(--surface);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(8,10,24,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.in1{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.in1{padding:10px 12px;min-height:110px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;padding:0 10px;border-radius:12px;background:var(--surface-2);font-weight:700;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:10px;align-items:center}
.stepper button{height:60px;border-radius:16px;background:var(--surface-2);font-size:28px;font-weight:800}
.stepper .in1{height:60px;text-align:center;font-size:28px;font-weight:800}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three .btn{min-height:84px;flex-direction:column;background:var(--diaper-bg);color:var(--diaper);font-size:16px}
.err{color:var(--cry);font-weight:700;font-size:13px}
.rowbtns{display:flex;gap:10px}.rowbtns .btn{flex:1}
/* snack */
#snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#snack button{min-height:40px;padding:0 14px;border-radius:10px;color:var(--bg);background:rgba(128,128,128,.35);font-weight:800}
/* cry */
.card.recwrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 16px 20px}
.rec{width:176px;height:176px;border-radius:50%;background:var(--cry);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:17px;box-shadow:0 0 0 12px var(--cry-bg),var(--shadow);position:relative}
.rec svg.i{width:44px;height:44px}
.rec .count{font-size:56px;line-height:1}
.rec.live{transition:box-shadow .08s}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--cry)}
.cause{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.cause .bar{grid-column:1/-1}
.cause b{font-size:15px}.cause.top b{font-size:19px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{color:var(--ink-2);font-size:13px}
.flag{background:var(--cry-bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px}
.flag b{color:var(--cry)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface-2);font-weight:700}
#sheet-root .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#sheet-root .chip{padding:0;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--bg);border-radius:12px;padding:8px 4px}
.kv b{display:block;font-size:17px}.kv span{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* milestones */
.ms{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 2px;min-height:52px;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.ms.done .box{background:var(--mile);border-color:var(--mile);color:var(--surface)}
.ms .d{display:block;color:var(--mile);font-size:12px;font-weight:700}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1}.prog .bar>i{background:var(--mile)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set{display:flex;flex-direction:column;gap:12px}
.set .line{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.set .line>span:first-child{flex:1 1 150px;min-width:0}
</style>

<body>
<div id="app"><header class="top" id="top"></header><main id="view" class="sec" style="gap:14px"></main></div>
<div id="dock" hidden></div>
<nav id="nav" aria-label="Sections"></nav>
<div id="sheet-root"></div>
<div id="snack" hidden role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="cry-file" accept="audio/*" hidden>

<script id="core">

    breast: function (s) {
      var now = Date.now(), af = C.active(state.events, 'feed');
      if (af) { if (af.side === s) return; commit('Switched to the ' + (s === 'L' ? 'left' : 'right'), function () { var x = Math.round((now - T(af.segStart)) / 1000); if (af.side === 'L') af.lsec = (af.lsec || 0) + x; else af.rsec = (af.rsec || 0) + x; af.side = s; af.segStart = iso(now); }); }
      else commit('Feed started on the ' + (s === 'L' ? 'left' : 'right'), function () { state.events.push({ id: C.uid(), type: 'feed', kind: 'breast', side: s, start: iso(now), segStart: iso(now), end: null, lsec: 0, rsec: 0 }); });
    },
    'feed-stop': function () {
      var now = Date.now(), af = C.active(state.events, 'feed'); if (!af) return;
      commit('Feed saved · ' + dur(now - T(af.start)), function () { var x = Math.round((now - T(af.segStart)) / 1000); if (af.side === 'L') af.lsec = (af.lsec || 0) + x; else af.rsec = (af.rsec || 0) + x; af.end = iso(now); delete af.segStart; });
    },
    'sleep-toggle': function () {
      var now = Date.now(), as = C.active(state.events, 'sleep');
      if (as) commit('Sleep saved · ' + dur(now - T(as.start)), function () { as.end = iso(now); });
      else commit('Sleep started', function () { state.events.push({ id: C.uid(), type: 'sleep', start: iso(now), end: null }); });
    },
    'bottle-open': function () { openSheet({ name: 'bottle' }); },
    amt: function (d) { var el = $('f-amount'), st = +el.step || 10; el.value = Math.max(0, Math.round(((+el.value || 0) + d * st) * 10) / 10); },
    'amt-set': function (n) { $('f-amount').value = n; },
    'save-bottle': function () {
      var a = +$('f-amount').value; if (!(a > 0)) return sheetErr('Enter the amount.');
      var ml = state.settings.units === 'oz' ? a * 29.5735 : a; if (ml > 500) return sheetErr('That amount looks too large. Check it.');
      var now = iso(Date.now()); closeSheet();
      commit('Bottle saved · ' + vol(ml), function () { state.events.push({ id: C.uid(), type: 'feed', kind: 'bottle', start: now, end: now, ml: ml }); });
    },
    'diaper-open': function () { openSheet({ name: 'diaper' }); },
    diaper: function (k) { closeSheet(); commit('Nappy saved · ' + DIAPER[k].toLowerCase(), function () { state.events.push({ id: C.uid(), type: 'diaper', kind: k, start: iso(Date.now()) }); }); },
    edit: function (id) { var e = state.events.filter(function (x) { return x.id === id; })[0]; if (e) openSheet({ name: 'edit', ev: JSON.parse(JSON.stringify(e)) }); },
    'add-open': function () { openSheet({ name: 'add', kind: 'breast', ev: draft('breast', Date.now()) }); },
    'add-kind': function (k) { openSheet({ name: 'add', kind: k, ev: draft(k, Date.now()) }); },
    'save-edit': function () {
      var s = ui.sheet, out = readForm(s.ev); if (typeof out === 'string') return sheetErr(out);
      var isNew = s.name === 'add'; closeSheet();
      commit(isNew ? 'Entry added' : 'Changes saved', function () { var i = state.events.findIndex(function (x) { return x.id === out.id; }); if (i >= 0) state.events[i] = out; else state.events.push(out); });
    },
    'delete': function () { var id = ui.sheet.ev.id; closeSheet(); if (ui.cry.id === id) ui.cry = { phase: 'idle' }; commit('Entry deleted', function () { state.events = state.events.filter(function (x) { return x.id !== id; }); }); },
    'sheet-close': function () { closeSheet(); },
    scrim: function (_, ev) { if (ev.target.id === 'scrim') closeSheet(); },
    'profile-open': function () { openSheet({ name: 'profile' }); },
    'save-profile': function () {
      var name = $('f-name').value.trim(), dob = $('f-dob').value, now = Date.now();
      if (!name) return sheetErr('Enter your baby’s name.');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dob) || isNaN(new Date(dob + 'T12:00').getTime())) return sheetErr('Enter the date of birth.');
      if (new Date(dob + 'T00:00').getTime() > now) return sheetErr('The date of birth is in the future.');
      if (now - new Date(dob + 'T00:00').getTime() > 3 * 366 * DAY) return sheetErr('This app covers the first year. Check the date of birth.');
      var wasDemo = state.demo; closeSheet(); ui.band = null;
      commit(wasDemo ? 'Welcome, ' + name : 'Profile saved', function () { if (wasDemo) { var set = state.settings; state = C.blank(); state.settings = set; } state.baby = { name: name, dob: dob }; state.demo = false; });
      if (wasDemo) { ui.undo = null; go('home'); }
    },
    units: function (u) { commit(null, function () { state.settings.units = u; }); },
    theme: function (t) { commit(null, function () { state.settings.theme = t; }); },
    'export': function () { var text = JSON.stringify({ app: 'baby-centre', schemaVersion: C.SCHEMA, exportedAt: iso(Date.now()), data: state }); openSheet({ name: 'export', text: text, saved: false }); },
    'export-file': function () { if (download(ui.sheet.text)) { ui.sheet.saved = true; renderSheet(); } },
    'export-copy': function () {
      var ta = $('f-backup'), ok = function () { snack('Backup text copied'); }, sel = function () { ta.focus(); ta.select(); snack('Text selected. Use Copy from the menu.'); };
      try { navigator.clipboard.writeText(ta.value).then(ok, sel); } catch (e) { sel(); }
    },
    'import-open': function () { openSheet({ name: 'import' }); },
    'import-pick': function () { $('import-file').click(); },
    'import-paste': function () { var t = $('f-paste').value.trim(); if (!t) return sheetErr('Paste the backup text first.'); var e = restore(t); if (e) sheetErr(e); },
    'erase-open': function () { openSheet({ name: 'erase', armed: false }); },
    'erase-yes': function () {
      if (!ui.sheet.armed) { ui.sheet.armed = true; return renderSheet(); }
      closeSheet(); state = C.demoData(Date.now()); try { localStorage.removeItem(KEY); } catch (e) { } ui.cry = { phase: 'idle' }; ui.band = null; go('home'); snack('All data erased. Showing sample data.');
    },
    week: function (d) { ui.week = Math.max(0, ui.week + (+d)); render(); },
    band: function (i) { ui.band = +i; render(); },
    ms: function (id) { commit(null, function () { if (state.milestones[id]) delete state.milestones[id]; else state.milestones[id] = toInput(Date.now()).slice(0, 10); }); },
    'cry-record': function () { cryRecord(); },
    'cry-cancel': function () { if (recStop) recStop(); },
    'cry-pick': function () { $('cry-file').click(); },
    'cry-again': function () { ui.cry = { phase: 'idle' }; render(); window.scrollTo(0, 0); },
    'cry-show': function (id) { ui.cry = { phase: 'result', id: id }; render(); window.scrollTo(0, 0); },
    'cry-actual': function (id, label) { commit(null, function () { var e = state.events.filter(function (x) { return x.id === id; })[0]; if (e) e.actual = e.actual === label ? null : label; }); }
  };
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el || el.disabled) return;
    var p = el.getAttribute('data-action').split(':'), fn = A[p[0]];
    if (fn) fn(p[1], p[0] === 'scrim' ? ev : p[2]);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) closeSheet(); });
  $('import-file').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    var fr = new FileReader(); fr.onload = function () { var e = restore(String(fr.result)); if (e) { if (!ui.sheet) openSheet({ name: 'import' }); sheetErr(e); } }; fr.readAsText(f);
  });
  $('cry-file').addEventListener('change', function () { var f = this.files[0]; this.value = ''; if (f) cryUpload(f); });
  window.addEventListener('hashchange', function () { var v = location.hash.slice(1); if (v !== ui.view) go(v); });

  /* ---------- boot ---------- */
  var ticks = 0;
  setInterval(function () {
    var now = Date.now(); ticks++;
    Array.prototype.forEach.call(document.querySelectorAll('[data-timer]'), function (el) { el.textContent = timer(now - T(el.getAttribute('data-timer'))); });
    if (ticks % 30 === 0 && !ui.sheet && (ui.view === 'home' || ui.view === 'trends')) render();
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !ui.sheet && ui.cry.phase !== 'rec') render(); });
  ui.view = VIEWS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'home';
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { } }
})();
</script>
